<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK KEY SYSTEM</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#020205;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#ff17320b 1px,transparent 1px),
    linear-gradient(90deg,#ff17320b 1px,transparent 1px);
  background-size:35px 35px;
  animation:grid 12s linear infinite;
}

@keyframes grid{
  to{
    background-position:35px 35px;
  }
}

.glow{
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:#ff1732;
  filter:blur(170px);
  opacity:.09;
  animation:move 8s ease-in-out infinite alternate;
}

@keyframes move{
  from{
    transform:translate(-25vw,-15vh);
  }
  to{
    transform:translate(25vw,15vh);
  }
}

.card{
  position:relative;
  z-index:2;
  width:min(430px,92%);
  padding:28px;
  border-radius:25px;
  border:1px solid #55131c;
  background:#08080cf5;
  box-shadow:
    0 0 45px #ff173329,
    0 30px 100px #000;
  backdrop-filter:blur(15px);
}

.logo{
  width:92px;
  height:92px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border:1px solid #ff2944;
  border-radius:27px;
  background:radial-gradient(
    circle,
    #3c0710,
    #08080c 70%
  );
  font-size:25px;
  font-weight:1000;
  letter-spacing:4px;
  box-shadow:
    0 0 35px #ff173355,
    inset 0 0 30px #ff17331c;
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.04);
    box-shadow:
      0 0 55px #ff173366;
  }
}

h1{
  margin:0;
  text-align:center;
  font-size:24px;
  letter-spacing:3px;
}

.sub{
  margin-top:7px;
  text-align:center;
  color:#777;
  font-size:9px;
  letter-spacing:3px;
}

.status{
  margin:20px 0;
  text-align:center;
  color:#55ffa2;
  font-size:10px;
  letter-spacing:2px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:6px;
  border-radius:50%;
  background:#55ffa2;
  box-shadow:0 0 12px #55ffa2;
}

label{
  display:block;
  margin-bottom:8px;
  color:#777;
  font-size:10px;
  letter-spacing:2px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #45131b;
  border-radius:12px;
  outline:none;
  background:#050507;
  color:#fff;
  text-align:center;
  font-size:16px;
  letter-spacing:1px;
}

input:focus{
  border-color:#ff2943;
  box-shadow:
    0 0 25px #ff17332b;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:1px solid #ff2943;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(
    90deg,
    #62000b,
    #e71932,
    #62000b
  );
  background-size:200%;
  font-weight:1000;
  letter-spacing:1.5px;
  cursor:pointer;
  box-shadow:
    0 0 25px #ff17332b;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:
    0 0 40px #ff173355;
}

button:disabled{
  opacity:.55;
  cursor:wait;
}

#message{
  min-height:22px;
  margin-top:14px;
  text-align:center;
  font-size:11px;
}

.success{
  color:#55ffa2;
}

.error{
  color:#ff5369;
}

.loading{
  color:#ffcc55;
}

#spinner{
  display:none;
  width:22px;
  height:22px;
  margin:12px auto 0;
  border:2px solid #40121a;
  border-top-color:#ff2943;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* KEY INFO */

#keyInfo{
  display:none;
  margin-top:18px;
  padding:16px;
  border:1px solid #263f32;
  border-radius:15px;
  background:#07100c;
  box-shadow:
    0 0 25px #55ffa21a;
}

.infoTitle{
  margin-bottom:12px;
  color:#55ffa2;
  text-align:center;
  font-size:10px;
  letter-spacing:2px;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 0;
  border-bottom:1px solid #ffffff0d;
  font-size:11px;
}

.infoRow:last-child{
  border-bottom:0;
}

.infoLabel{
  color:#777;
}

.infoValue{
  color:#fff;
  text-align:right;
  word-break:break-all;
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#555;
  font-size:8px;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

  <div class="logo">
    AHK
  </div>

  <h1>
    KEY AUTHENTICATION
  </h1>

  <div class="sub">
    ADVANCED SECURITY SYSTEM
  </div>

  <div class="status">
    <span class="dot"></span>
    SECURE SERVER ONLINE
  </div>

  <label for="keyInput">
    LICENSE KEY
  </label>

  <input
    id="keyInput"
    type="text"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="HK-XXXX-XXXX-XXXX"
  >

  <button
    id="verifyButton"
    type="button"
  >
    ⚡ XÁC NHẬN KEY
  </button>

  <div id="spinner"></div>

  <div id="message"></div>

  <!--
    Chỉ hiện sau khi server xác thực thành công.
  -->

  <div id="keyInfo">

    <div class="infoTitle">
      ✓ KEY ĐÃ XÁC THỰC
    </div>

    <div class="infoRow">

      <span class="infoLabel">
        KEY
      </span>

      <span
        class="infoValue"
        id="validKey"
      >
        —
      </span>

    </div>

    <div class="infoRow">

      <span class="infoLabel">
        HẠN SỬ DỤNG
      </span>

      <span
        class="infoValue"
        id="expires"
      >
        —
      </span>

    </div>

    <div class="infoRow">

      <span class="infoLabel">
        THIẾT BỊ
      </span>

      <span
        class="infoValue"
      >
        1 DEVICE
      </span>

    </div>

  </div>

  <div class="footer">
    1 KEY • 1 DEVICE • SESSION PROTECTED
  </div>

</div>

<script>

const VERIFY_URL =
  "/api/verify";

const APP_URL =
  "/donhayhoangkhoiv2vip.html";


/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId(){

  let id =
    localStorage.getItem(
      "ahk_device_id"
    );

  if(!id){

    if(
      window.crypto &&
      crypto.randomUUID
    ){

      id =
        "AHK-" +
        crypto.randomUUID();

    }else{

      id =
        "AHK-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);

    }

    localStorage.setItem(
      "ahk_device_id",
      id
    );
  }

  return id;
}


/* =====================================================
   DATE
===================================================== */

function formatExpiration(value){

  if(value === null){

    return "VĨNH VIỄN";

  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "KHÔNG XÁC ĐỊNH";

  }

  return date.toLocaleString(
    "vi-VN",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.className =
    type;

  box.textContent =
    text;
}


/* =====================================================
   AUDIO
===================================================== */

let audioContext =
  null;

function beep(
  frequency,
  duration,
  type="sine"
){

  try{

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC)return;

    if(!audioContext){

      audioContext =
        new AC();

    }

    const oscillator =
      audioContext
        .createOscillator();

    const gain =
      audioContext
        .createGain();

    oscillator.type =
      type;

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime
    );

    gain.gain
      .exponentialRampToValueAtTime(
        .06,
        audioContext.currentTime +
        .01
      );

    gain.gain
      .exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime +
        duration
      );

    oscillator.connect(gain);
    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration +
      .02
    );

  }catch(error){}
}


/* =====================================================
   SHOW KEY INFO
===================================================== */

function showKeyInfo(
  key,
  expiresAt
){

  document
    .getElementById(
      "validKey"
    )
    .textContent =
      key;

  document
    .getElementById(
      "expires"
    )
    .textContent =
      formatExpiration(
        expiresAt
      );

  document
    .getElementById(
      "keyInfo"
    )
    .style.display =
      "block";
}


/* =====================================================
   VERIFY
===================================================== */

async function verifyKey(){

  const input =
    document.getElementById(
      "keyInput"
    );

  const button =
    document.getElementById(
      "verifyButton"
    );

  const spinner =
    document.getElementById(
      "spinner"
    );

  const key =
    input.value
      .trim()
      .toUpperCase();

  document
    .getElementById(
      "keyInfo"
    )
    .style.display =
      "none";

  if(!key){

    showMessage(
      "✕ VUI LÒNG NHẬP KEY",
      "error"
    );

    beep(
      180,
      .15,
      "square"
    );

    input.focus();

    return;
  }

  button.disabled =
    true;

  spinner.style.display =
    "block";

  showMessage(
    "ĐANG XÁC THỰC...",
    "loading"
  );

  try{

    const response =
      await fetch(
        VERIFY_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"same-origin",

          body:JSON.stringify({
            key:key,
            deviceId:
              getDeviceId()
          })
        }
      );

    let result;

    try{

      result =
        await response.json();

    }catch(error){

      result = {
        valid:false,
        code:"SERVER_ERROR"
      };

    }

    /* =====================
       SUCCESS
    ===================== */

    if(
      response.ok &&
      result.valid === true
    ){

      showMessage(
        result.firstActivation
          ? "✓ KÍCH HOẠT THÀNH CÔNG"
          : "✓ KEY XÁC THỰC THÀNH CÔNG",
        "success"
      );

      showKeyInfo(
        result.key || key,
        result.expiresAt
      );

      beep(
        720,
        .08
      );

      setTimeout(
        () => {
          beep(
            1080,
            .1
          );
        },
        100
      );

      /*
        Session cookie đã được server set.

        Chờ một chút để người dùng thấy
        thông tin key + hạn sử dụng.
      */

      setTimeout(
        () => {

          window.location.href =
            APP_URL;

        },
        1800
      );

      return;
    }

    /* =====================
       ERRORS
    ===================== */

    if(
      result.code ===
      "DEVICE_MISMATCH"
    ){

      showMessage(
        "✕ KEY ĐÃ ĐƯỢC DÙNG TRÊN THIẾT BỊ KHÁC",
        "error"
      );

    }else if(
      result.code ===
      "KEY_EXPIRED"
    ){

      showMessage(
        "✕ KEY ĐÃ HẾT HẠN",
        "error"
      );

    }else if(
      result.code ===
      "KEY_DISABLED"
    ){

      showMessage(
        "✕ KEY ĐÃ BỊ KHÓA",
        "error"
      );

    }else if(
      result.code ===
      "KEY_REQUIRED"
    ){

      showMessage(
        "✕ VUI LÒNG NHẬP KEY",
        "error"
      );

    }else{

      showMessage(
        "✕ KEY KHÔNG HỢP LỆ",
        "error"
      );

    }

    beep(
      180,
      .16,
      "square"
    );

  }catch(error){

    console.error(
      error
    );

    showMessage(
      "✕ KHÔNG KẾT NỐI ĐƯỢC SERVER",
      "error"
    );

    beep(
      180,
      .16,
      "square"
    );

  }finally{

    button.disabled =
      false;

    spinner.style.display =
      "none";
  }
}


/* =====================================================
   CLICK
===================================================== */

document
  .getElementById(
    "verifyButton"
  )
  .addEventListener(
    "click",
    verifyKey
  );


/* =====================================================
   ENTER
===================================================== */

document
  .getElementById(
    "keyInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        verifyKey();

      }

    }
  );


/* =====================================================
   URL MESSAGE
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

if(
  params.get("login") ===
  "required"
){

  showMessage(
    "VUI LÒNG NHẬP KEY ĐỂ VÀO APP",
    "error"
  );

}

if(
  params.get("session") ===
  "expired"
){

  showMessage(
    "✕ PHIÊN ĐÃ HẾT HẠN",
    "error"
  );

}

if(
  params.get("session") ===
  "disabled"
){

  showMessage(
    "✕ KEY ĐÃ BỊ KHÓA",
    "error"
  );

}

if(
  params.get("session") ===
  "device"
){

  showMessage(
    "✕ THIẾT BỊ KHÔNG HỢP LỆ",
    "error"
  );

}

</script>

</body>
  </html>
