<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK KEY SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#020205;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#ff17320b 1px,transparent 1px),
    linear-gradient(90deg,#ff17320b 1px,transparent 1px);
  background-size:35px 35px;
  animation:grid 12s linear infinite;
}

@keyframes grid{
  to{
    background-position:35px 35px;
  }
}

.glow{
  position:fixed;
  width:400px;
  height:400px;
  border-radius:50%;
  background:#ff1732;
  filter:blur(180px);
  opacity:.08;
  animation:move 8s ease-in-out infinite alternate;
}

@keyframes move{
  from{transform:translate(-25vw,-15vh)}
  to{transform:translate(25vw,15vh)}
}

.card{
  position:relative;
  z-index:2;
  width:min(430px,92%);
  padding:28px;
  border-radius:25px;
  border:1px solid #55131c;
  background:#08080cf2;
  box-shadow:
    0 0 45px #ff173329,
    0 30px 100px #000;
  backdrop-filter:blur(15px);
}

.logo{
  width:92px;
  height:92px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border:1px solid #ff2944;
  border-radius:27px;
  background:radial-gradient(circle,#3c0710,#08080c 70%);
  font-size:25px;
  font-weight:1000;
  letter-spacing:4px;
  box-shadow:
    0 0 35px #ff173355,
    inset 0 0 30px #ff17331c;
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.04);
    box-shadow:0 0 55px #ff173366;
  }
}

h1{
  margin:0;
  text-align:center;
  font-size:24px;
  letter-spacing:3px;
}

.sub{
  margin-top:7px;
  text-align:center;
  color:#777;
  font-size:9px;
  letter-spacing:3px;
}

.status{
  margin:20px 0;
  text-align:center;
  color:#55ffa2;
  font-size:10px;
  letter-spacing:2px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:6px;
  border-radius:50%;
  background:#55ffa2;
  box-shadow:0 0 12px #55ffa2;
}

label{
  display:block;
  margin-bottom:8px;
  color:#777;
  font-size:10px;
  letter-spacing:2px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #45131b;
  border-radius:12px;
  outline:none;
  background:#050507;
  color:#fff;
  text-align:center;
  font-size:16px;
  letter-spacing:1px;
}

input:focus{
  border-color:#ff2943;
  box-shadow:0 0 25px #ff17332b;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:1px solid #ff2943;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(
    90deg,
    #62000b,
    #e71932,
    #62000b
  );
  background-size:200%;
  font-weight:1000;
  letter-spacing:1.5px;
  cursor:pointer;
  box-shadow:0 0 25px #ff17332b;
}

button:hover{
  box-shadow:0 0 40px #ff173355;
  transform:translateY(-1px);
}

button:disabled{
  opacity:.55;
}

#message{
  min-height:22px;
  margin-top:14px;
  text-align:center;
  font-size:11px;
}

.success{color:#55ffa2}
.error{color:#ff5369}
.loading{color:#ffcc55}

#spinner{
  display:none;
  width:22px;
  height:22px;
  margin:12px auto 0;
  border:2px solid #40121a;
  border-top-color:#ff2943;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#555;
  font-size:8px;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

  <div class="logo">AHK</div>

  <h1>KEY AUTHENTICATION</h1>

  <div class="sub">
    ADVANCED SECURITY SYSTEM
  </div>

  <div class="status">
    <span class="dot"></span>
    SECURE SERVER ONLINE
  </div>

  <label for="keyInput">
    LICENSE KEY
  </label>

  <input
    id="keyInput"
    type="text"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="HK-XXXX-XXXX-XXXX"
  >

  <button
    id="verifyButton"
    type="button"
  >
    ⚡ XÁC NHẬN KEY
  </button>

  <div id="spinner"></div>

  <div id="message"></div>

  <div class="footer">
    1 KEY • 1 DEVICE • SERVER VERIFIED
  </div>

</div>

<script>

const VERIFY_URL =
  "https://hk-key-manager.onrender.com/api/verify";

const APP_URL =
  "https://hk-key-manager.onrender.com/donhayhoangkhoiv2vip.html";


/* DEVICE ID */

function getDeviceId(){

  let id =
    localStorage.getItem(
      "ahk_device_id"
    );

  if(!id){

    id =
      "AHK-" +
      (
        crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now()+"-"+Math.random()
      );

    localStorage.setItem(
      "ahk_device_id",
      id
    );
  }

  return id;
}


/* AUDIO */

let audioContext=null;

function beep(
  frequency,
  duration,
  type="sine"
){

  try{

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC)return;

    if(!audioContext)
      audioContext=new AC();

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type=type;
    osc.frequency.value=
      frequency;

    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .06,
      audioContext.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioContext.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(
      audioContext.destination
    );

    osc.start();

    osc.stop(
      audioContext.currentTime+
      duration+
      .02
    );

  }catch(e){}
}


/* MESSAGE */

function message(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.className=type;
  box.textContent=text;
}


/* VERIFY */

async function verifyKey(){

  const input =
    document.getElementById(
      "keyInput"
    );

  const button =
    document.getElementById(
      "verifyButton"
    );

  const spinner =
    document.getElementById(
      "spinner"
    );

  const key =
    input.value
      .trim()
      .toUpperCase();

  if(!key){

    message(
      "✕ VUI LÒNG NHẬP KEY",
      "error"
    );

    beep(180,.15,"square");

    input.focus();

    return;
  }

  button.disabled=true;
  spinner.style.display="block";

  message(
    "ĐANG XÁC THỰC...",
    "loading"
  );

  beep(900,.05);

  try{

    const response =
      await fetch(
        VERIFY_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            key:key,
            deviceId:getDeviceId()
          })
        }
      );

    const result =
      await response.json();

    if(
      response.ok &&
      result.valid===true
    ){

      message(
        result.firstActivation
          ? "✓ KÍCH HOẠT THÀNH CÔNG"
          : "✓ KEY XÁC THỰC THÀNH CÔNG",
        "success"
      );

      beep(720,.08);

      setTimeout(
        ()=>beep(1080,.1),
        100
      );

      setTimeout(
        ()=>{
          window.location.href=
            APP_URL;
        },
        900
      );

      return;
    }

    if(
      result.code===
      "DEVICE_MISMATCH"
    ){

      message(
        "✕ KEY ĐÃ ĐƯỢC DÙNG TRÊN THIẾT BỊ KHÁC",
        "error"
      );

    }else if(
      result.code===
      "KEY_EXPIRED"
    ){

      message(
        "✕ KEY ĐÃ HẾT HẠN",
        "error"
      );

    }else if(
      result.code===
      "KEY_DISABLED"
    ){

      message(
        "✕ KEY ĐÃ BỊ KHÓA",
        "error"
      );

    }else{

      message(
        "✕ KEY KHÔNG HỢP LỆ",
        "error"
      );
    }

    beep(180,.16,"square");

  }catch(error){

    console.error(error);

    message(
      "✕ KHÔNG KẾT NỐI ĐƯỢC SERVER",
      "error"
    );

    beep(180,.16,"square");

  }finally{

    button.disabled=false;
    spinner.style.display="none";
  }
}


/* CLICK */

document
  .getElementById(
    "verifyButton"
  )
  .addEventListener(
    "click",
    verifyKey
  );


/* ENTER */

document
  .getElementById(
    "keyInput"
  )
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter")
        verifyKey();
    }
  );

</script>

</body>
   </html>
