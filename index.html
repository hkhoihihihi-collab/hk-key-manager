<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ADMIN HOÀNG KHÔI • AHK CORE</title>
<style>
*{box-sizing:border-box} :root{--r:#ff1730;--r2:#85000e;--bg:#030305;--p:#0b0b10;--line:#3a1017}
body{margin:0;background:var(--bg);color:#f5f5f7;font:14px system-ui,Arial;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-4;background:linear-gradient(#ff17300b 1px,transparent 1px),linear-gradient(90deg,#ff17300b 1px,transparent 1px);background-size:36px 36px;animation:grid 11s linear infinite}
body:after{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% -5%,#ff10222a,transparent 38%),radial-gradient(circle at 5% 90%,#8b00141a,transparent 28%);pointer-events:none}
@keyframes grid{to{background-position:36px 36px}}
#particles{position:fixed;inset:0;z-index:-2;pointer-events:none}.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:#ff3046;box-shadow:0 0 9px #ff3046;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh);opacity:0}20%{opacity:.8}90%{opacity:.35}to{transform:translateY(-10vh);opacity:0}}
.shell{max-width:1050px;margin:auto;padding:18px 14px 45px}
header{display:flex;align-items:center;gap:14px;padding:8px 0 16px}
.logo{width:70px;height:70px;flex:none;position:relative;display:grid;place-items:center;border:1px solid #ff3045;border-radius:22px;background:linear-gradient(145deg,#32060b,#07070a);font-size:25px;font-weight:1000;letter-spacing:3px;box-shadow:0 0 22px #ff173850,0 0 75px #ff173320;animation:pulse 2s ease-in-out infinite}
.logo:before,.logo:after{content:"";position:absolute;inset:-7px;border:1px solid #ff203326;border-radius:26px;animation:spin 7s linear infinite}
.logo:after{inset:-13px;border-style:dashed;animation:spin 12s linear infinite reverse}
@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 0 34px #ff173865,0 0 95px #ff173326}}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:24px;letter-spacing:2px;margin:0}.sub{color:#858791;font-size:10px;letter-spacing:3px;margin-top:4px}.sys{margin-left:auto;text-align:right;font-size:9px;color:#62ffad;letter-spacing:1px}.dot{display:inline-block;width:6px;height:6px;background:#36ff91;border-radius:50%;box-shadow:0 0 10px #36ff91;margin-right:5px;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}
.card{position:relative;margin-top:13px;padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0e0e13ef,#07070aef);box-shadow:0 18px 55px #000a;overflow:hidden}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#ff243b,transparent);animation:beam 3s linear infinite}@keyframes beam{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:28px;color:#ff3448}.muted{color:#8e9099;font-size:10px;letter-spacing:1px}
.form{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;margin-top:12px}input,select,button{border:1px solid #42131a;border-radius:10px;background:#060609;color:#eee;padding:12px;outline:none}input:focus,select:focus{border-color:#ff263d;box-shadow:0 0 18px #ff183322}button{cursor:pointer;font-weight:900;letter-spacing:.8px}.primary{background:linear-gradient(90deg,#65000b,#ef172b,#65000b);background-size:200%;border-color:#ff3044;box-shadow:0 0 22px #ff17331f;animation:shine 2.8s linear infinite}@keyframes shine{to{background-position:200%}}
.section-title{display:flex;justify-content:space-between;align-items:center}.badge{padding:5px 9px;border-radius:20px;background:#071d13;color:#49ff9d;border:1px solid #174c32;font-size:10px}
.table{overflow:auto;margin-top:12px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #251116}th{font-size:10px;color:#777;letter-spacing:1px}.key{font-weight:900;letter-spacing:1px}.actions button{padding:7px 9px;font-size:10px;margin-right:4px}
#login{max-width:430px;margin:70px auto}.hide{display:none}.login-sub{text-align:center;color:#777;font-size:10px;letter-spacing:2px}.scan{height:2px;margin-top:15px;background:#ff1e34;box-shadow:0 0 15px #ff1e34;animation:scan 1.7s infinite}@keyframes scan{0%,100%{transform:scaleX(.08);opacity:.2}50%{transform:scaleX(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px;border:1px solid #5c1420;border-radius:12px;background:#0a090cf2;box-shadow:0 0 30px #ff173322;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}.sys{display:none}}
</style>
</head>
<body>
<div id="particles"></div>

<section id="login" class="card" style="max-width:430px;margin:70px auto">
  <div class="logo" style="margin:auto">AHK</div>
  <h1 style="text-align:center;margin-top:17px">ADMIN HOÀNG KHÔI</h1>
  <div class="login-sub">HOLOGRAM SECURITY CORE • ADMIN ACCESS</div>
  <input id="pw" type="password" placeholder="ADMIN PASSWORD" style="width:100%;margin-top:20px">
  <button class="primary" style="width:100%;margin-top:11px" onclick="enter()">⚡ AUTHENTICATE</button>
  <div id="loginMsg" style="text-align:center;margin-top:10px;color:#ff5364;font-size:11px"></div>
  <div class="scan"></div>
</section>

<main id="dashboard" class="shell hide">
<header>
  <div class="logo">AHK</div>
  <div><h1>ADMIN HOÀNG KHÔI</h1><div class="sub">KEY CONTROL CENTER • AHK CORE</div></div>
  <div class="sys"><span class="dot"></span>SYSTEM ONLINE<br>SECURITY ACTIVE</div>
</header>

<div class="stats">
  <div class="card"><div class="muted">TOTAL KEYS</div><div id="total" class="stat"><b>0</b></div></div>
  <div class="card"><div class="muted">ACTIVE</div><div id="active" class="stat"><b>0</b></div></div>
  <div class="card"><div class="muted">EXPIRED</div><div id="expired" class="stat"><b>0</b></div></div>
  <div class="card"><div class="muted">LOCKED</div><div id="locked" class="stat"><b>0</b></div></div>
</div>

<div class="card">
  <div class="section-title"><b>KEY GENERATOR</b><span class="badge">SERVER READY</span></div>
  <div class="form">
    <select id="duration">
      <option value="1h">1 giờ</option><option value="6h">6 giờ</option><option value="12h">12 giờ</option>
      <option value="1d">1 ngày</option><option value="3d">3 ngày</option><option value="7d">7 ngày</option>
      <option value="14d">14 ngày</option><option value="30d" selected>30 ngày</option><option value="3m">3 tháng</option>
      <option value="6m">6 tháng</option><option value="1y">1 năm</option><option value="forever">Vĩnh viễn</option>
    </select>
    <input id="appId" placeholder="APP ID (all / app1)">
    <input id="custom" type="datetime-local" title="Tùy chọn HSD cụ thể">
    <button class="primary" onclick="createKey()">＋ CREATE KEY</button>
  </div>
</div>

<div class="card">
  <div class="section-title"><b>KEY DATABASE</b><span id="count" class="muted">0 records</span></div>
  <input id="search" placeholder="🔎 Search key / app..." style="width:100%;margin-top:12px" oninput="render()">
  <div class="table"><table><thead><tr><th>KEY</th><th>APP</th><th>CREATED</th><th>EXPIRES</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</main>

<div id="toast" class="toast"></div>

<script>
const particleBox=document.getElementById('particles');
for(let i=0;i<42;i++){let e=document.createElement('i');e.className='particle';e.style.left=Math.random()*100+'%';e.style.animationDuration=(5+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*12)+'s';particleBox.appendChild(e)}
let password='',keys=[];
const headers=()=>({'x-admin-password':password,'Content-Type':'application/json'});
const audio=new (window.AudioContext||window.webkitAudioContext)();
function tone(f=900,d=.06,type='sine'){let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.01)}
function welcome(){tone(720,.07);setTimeout(()=>tone(1050,.09),90)}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
async function enter(){
  tone(1200,.05);
  password=document.getElementById('pw').value.trim();
  if(!password){document.getElementById('loginMsg').textContent='VUI LÒNG NHẬP ADMIN PASSWORD';tone(180,.14,'square');return}
  try{let r=await fetch('/api/keys',{headers:headers()});if(!r.ok)throw 0;keys=await r.json();document.getElementById('login').classList.add('hide');document.getElementById('dashboard').classList.remove('hide');welcome();render();toast('ACCESS GRANTED • SYSTEM ONLINE')}catch(e){document.getElementById('loginMsg').textContent='ACCESS DENIED';tone(180,.15,'square')}}
async function load(){let r=await fetch('/api/keys',{headers:headers()});if(r.ok){keys=await r.json();render()}}
async function createKey(){
  tone(1250,.06);
  let body={duration:document.getElementById('duration').value,custom:document.getElementById('custom').value,appId:document.getElementById('appId').value.trim()||'all'};
  let r=await fetch('/api/keys',{method:'POST',headers:headers(),body:JSON.stringify(body)});
  if(!r.ok){toast('CREATE KEY FAILED');tone(180,.15,'square');return}
  let k=await r.json();await load();toast('KEY CREATED • '+k.key);tone(760,.07);setTimeout(()=>tone(1120,.08),80)
}
async function action(id,type){
  tone(1100,.05);
  let opt={method:type==='delete'?'DELETE':'PATCH',headers:headers()};
  if(type==='toggle'){let x=keys.find(k=>k.id===id);opt.body=JSON.stringify({disabled:!x.disabled})}
  await fetch('/api/keys/'+id,opt);load()
}
function render(){
  let now=Date.now(),q=document.getElementById('search').value.toLowerCase();
  let total=keys.length,active=keys.filter(x=>!x.disabled&&(!x.expiresAt||new Date(x.expiresAt)>now)).length,expired=keys.filter(x=>x.expiresAt&&new Date(x.expiresAt)<=now).length,locked=keys.filter(x=>x.disabled).length;
  document.getElementById('total').innerHTML='<b>'+total+'</b>';document.getElementById('active').innerHTML='<b>'+active+'</b>';document.getElementById('expired').innerHTML='<b>'+expired+'</b>';document.getElementById('locked').innerHTML='<b>'+locked+'</b>';
  let f=keys.filter(x=>(x.key||'').toLowerCase().includes(q)||(x.appId||'').toLowerCase().includes(q));document.getElementById('count').textContent=f.length+' records';
  document.getElementById('rows').innerHTML=f.map(x=>{let exp=x.expiresAt&&new Date(x.expiresAt)<=now,bad=x.disabled||exp;return '<tr><td class="key">'+x.key+'<br><button onclick="navigator.clipboard.writeText(\\''+x.key+'\\');toast(\\'COPIED\\')">COPY</button></td><td>'+(x.appId||'all')+'</td><td>'+new Date(x.createdAt).toLocaleString('vi-VN')+'</td><td>'+(x.expiresAt?new Date(x.expiresAt).toLocaleString('vi-VN'):'Vĩnh viễn')+'</td><td><span class="badge" style="'+(bad?'background:#300a0e;color:#ff6675;border-color:#5c1720':'')+'">'+(x.disabled?'LOCKED':exp?'EXPIRED':'ACTIVE')+'</span></td><td class="actions"><button onclick="action(\\''+x.id+'\\',\\'toggle\\')">'+(x.disabled?'UNLOCK':'LOCK')+'</button><button onclick="action(\\''+x.id+'\\',\\'delete\\')">DELETE</button></td></tr>'}).join('')
}
</script>
</body></html>
