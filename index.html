<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN HOÀNG KHÔI</title>
<style>
:root{--r:#ff1e2d;--bg:#050507}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#420912,#050507 55%);color:#eee;font-family:system-ui,Arial}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ff14200a 1px,transparent 1px),linear-gradient(90deg,#ff14200a 1px,transparent 1px);background-size:38px 38px;animation:grid 10s linear infinite}
@keyframes grid{to{background-position:38px 38px}}
.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}.top{text-align:center;padding:18px 0}.logo{width:88px;height:88px;margin:auto;border:1px solid #ff3045;border-radius:24px;display:grid;place-items:center;font-size:31px;font-weight:1000;letter-spacing:3px;background:linear-gradient(145deg,#3b050b,#09090b);box-shadow:0 0 15px #f11,0 0 55px #f112;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 25px #f22,0 0 75px #f114}}h1{font-size:25px;letter-spacing:2px;margin:15px 0 4px}.sub{font-size:10px;color:#aaa;letter-spacing:3px}.card{margin-top:16px;padding:18px;border:1px solid #3a1017;border-radius:18px;background:#0d0d11ee;box-shadow:0 20px 60px #000b}.label{font-size:11px;color:#999;letter-spacing:1.5px;margin:12px 0 7px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #4a141b;background:#07070a;color:#fff;font-size:16px;letter-spacing:2px;outline:none}input:focus{border-color:#ff2638;box-shadow:0 0 0 3px #ff1e2d22}button{width:100%;padding:15px;margin-top:13px;border:1px solid #ff3040;border-radius:12px;color:#fff;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#65000b,#f0182b,#65000b);background-size:200% 100%;animation:shine 3s linear infinite;box-shadow:0 0 24px #f113}
@keyframes shine{to{background-position:200% 0}}.status{display:none;margin-top:15px;padding:14px;border-radius:12px;text-align:center;font-weight:900;letter-spacing:1.5px}.ok{display:block;background:#081c12;border:1px solid #18b76b;color:#45ff9c}.bad{display:block;background:#26080c;border:1px solid #e21b30;color:#ff5262}.scan{height:2px;background:#ff2333;margin:16px 0 0;box-shadow:0 0 12px #f22;animation:scan 2s infinite}@keyframes scan{0%,100%{transform:scaleX(.1);opacity:.2}50%{transform:scaleX(1);opacity:1}}.footer{text-align:center;color:#555;font-size:10px;margin-top:18px;letter-spacing:1px}
</style></head><body><div class="wrap"><div class="top"><div class="logo">AHK</div><h1>ADMIN HOÀNG KHÔI</h1><div class="sub">SECURE ACCESS // HOLOGRAM SYSTEM</div></div><div class="card"><div class="label">ACCESS KEY</div><input id="key" autocomplete="off" placeholder="HK-XXXX-XXXX-XXXX"><button onclick="verify()">⚡ XÁC NHẬN KEY</button><div class="scan"></div><div id="status" class="status"></div></div><div class="card"><div class="label">SYSTEM</div><div style="color:#888;font-size:13px">Giao diện đã sẵn sàng để nối API Render và xác thực key + HSD.</div></div><div class="footer">ADMIN HOÀNG KHÔI • AHK SECURITY</div></div><script>function verify(){const s=document.getElementById('status'),k=document.getElementById('key').value.trim();if(!k){s.className='status bad';s.textContent='⚠ VUI LÒNG NHẬP KEY';return}s.className='status ok';s.textContent='✓ KEY ĐÃ ĐƯỢC GỬI KIỂM TRA';}</script></body></html>
