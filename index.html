<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN HOÀNG KHÔI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#040406;color:#eee;font-family:system-ui,Arial}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#f21b2b0a 1px,transparent 1px),linear-gradient(90deg,#f21b2b0a 1px,transparent 1px);background-size:34px 34px;animation:g 9s linear infinite;pointer-events:none}@keyframes g{to{background-position:34px 34px}}.wrap{max-width:500px;margin:auto;padding:25px 16px}.logo{width:90px;height:90px;margin:auto;border:1px solid #ff2035;border-radius:25px;display:grid;place-items:center;font-size:30px;font-weight:1000;letter-spacing:4px;background:#160509;box-shadow:0 0 18px #f22,0 0 70px #f113;animation:p 1.8s infinite}@keyframes p{50%{transform:scale(1.04);box-shadow:0 0 35px #f22,0 0 90px #f116}}h1{text-align:center;margin:16px 0 3px;font-size:25px;letter-spacing:2px}.sub{text-align:center;color:#888;font-size:10px;letter-spacing:3px}.card{margin-top:20px;padding:18px;border:1px solid #421019;border-radius:18px;background:#0b0b0fee;box-shadow:0 20px 60px #000c}label{display:block;color:#999;font-size:11px;letter-spacing:2px;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #4a151d;border-radius:11px;background:#050508;color:#fff;font-size:16px;outline:0}button{width:100%;margin-top:12px;padding:15px;border:1px solid #ff3040;border-radius:11px;color:white;font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,#65000b,#ef172b,#65000b);background-size:200%;animation:s 2.5s linear infinite;box-shadow:0 0 24px #f113}@keyframes s{to{background-position:200%}}#admin{display:none}.grant{color:#48ffa0;text-align:center;font-weight:900;letter-spacing:2px}.line{height:2px;margin-top:18px;background:#f22;box-shadow:0 0 18px #f22;animation:scan 1.5s infinite}@keyframes scan{0%,100%{transform:scaleX(.1);opacity:.2}50%{transform:scaleX(1);opacity:1}}</style></head><body>
<div id="login" class="wrap"><div class="logo">AHK</div><h1>ADMIN HOÀNG KHÔI</h1><div class="sub">HOLOGRAM SECURITY SYSTEM</div><div class="card"><label>ADMIN PASSWORD</label><input id="pw" type="password" placeholder="Nhập mật khẩu Admin"><button onclick="enter()">⚡ ĐĂNG NHẬP</button><div id="msg"></div><div class="line"></div></div></div>
<div id="admin" class="wrap"><div class="logo">AHK</div><h1>ADMIN HOÀNG KHÔI</h1><div class="sub">KEY CONTROL CENTER</div><div class="card"><div class="grant">✓ ACCESS GRANTED</div><div style="text-align:center;color:#aaa;margin-top:10px">Chào mừng đến với kho key của Hoàng Khôi đẹp trai.</div><div class="line"></div><button onclick="clickSound()">＋ TẠO KEY</button><button onclick="clickSound()">🔑 QUẢN LÝ KEY</button></div></div>
<script>
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(f=900,d=.07,t='sine'){let o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.08,AC.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.01)}
function clickSound(){beep(1200,.06)}
function welcome(){beep(700,.08);setTimeout(()=>beep(1000,.1),90);setTimeout(()=>{let u=new SpeechSynthesisUtterance('Chào mừng đến với kho key của Hoàng Khôi đẹp trai.');u.lang='vi-VN';u.rate=.92;u.pitch=.85;speechSynthesis.speak(u)},220)}
async function enter(){beep(1200,.06);let v=pw.value.trim();if(!v){msg.innerHTML='<div style="color:#ff5666;text-align:center;margin-top:12px">⚠ VUI LÒNG NHẬP MẬT KHẨU</div>';beep(180,.16,'square');return}try{let r=await fetch('/api/keys',{headers:{'x-admin-password':v}});if(!r.ok)throw 0;login.style.display='none';admin.style.display='block';welcome()}catch(e){msg.innerHTML='<div style="color:#ff5666;text-align:center;margin-top:12px;font-weight:800">ACCESS DENIED</div>';beep(180,.16,'square')}}
</script></body></html>
