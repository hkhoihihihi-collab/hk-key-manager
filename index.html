<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK Key Manager</title>
<style>
body{margin:0;background:#0b0d10;color:#eee;font:15px system-ui;padding:18px}main{max-width:900px;margin:auto}
.card{background:#15181d;border:1px solid #292e36;border-radius:14px;padding:16px;margin:12px 0}
input,select,button{background:#0e1115;color:#eee;border:1px solid #343a44;border-radius:9px;padding:10px;margin:4px}
button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{font-size:22px}.muted{color:#9da5b1}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e36;text-align:left}
.badge{padding:4px 8px;border-radius:20px;background:#243b2a}.off{background:#402727}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}
</style><main>
<h1>🔑 HK Key Manager</h1>
<div class="card"><input id="pass" type="password" placeholder="Admin password">
<select id="dur"><option value="1h">1 giờ</option><option value="6h">6 giờ</option><option value="12h">12 giờ</option><option value="1d">1 ngày</option><option value="3d">3 ngày</option><option value="7d">7 ngày</option><option value="14d">14 ngày</option><option value="30d" selected>30 ngày</option><option value="3m">3 tháng</option><option value="6m">6 tháng</option><option value="1y">1 năm</option><option value="forever">Vĩnh viễn</option><option value="custom">Tùy chỉnh</option></select>
<input id="custom" type="datetime-local" style="display:none"><button onclick="createKey()">＋ Tạo key</button></div>
<div class="grid"><div class="card">Tổng<div id="total" class="stat">0</div></div><div class="card">Hoạt động<div id="active" class="stat">0</div></div><div class="card">Hết hạn<div id="expired" class="stat">0</div></div><div class="card">Đã khóa<div id="disabled" class="stat">0</div></div></div>
<div class="card"><input id="search" placeholder="Tìm key..." oninput="render()"><div style="overflow:auto"><table><thead><tr><th>Key</th><th>Tạo</th><th>HSD</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
let data=[];
const H=()=>({'x-admin-password':document.querySelector('#pass').value,'Content-Type':'application/json'});
async function load(){let r=await fetch('/api/keys',{headers:H()}); if(r.ok){data=await r.json();render()} }
dur.onchange=()=>custom.style.display=dur.value==='custom'?'inline-block':'none';
async function createKey(){let body={duration:dur.value,custom:custom.value};let r=await fetch('/api/keys',{method:'POST',headers:H(),body:JSON.stringify(body)});if(r.ok){await load();alert('Key: '+(await r.json()).key)}else alert('Sai mật khẩu')}
async function act(id,op){await fetch('/api/keys/'+id,{method:op==='delete'?'DELETE':'PATCH',headers:H(),body:op==='toggle'?JSON.stringify({disabled:!data.find(x=>x.id===id).disabled}):undefined});load()}
function render(){let q=search.value.toLowerCase(),now=Date.now();let f=data.filter(x=>x.key.toLowerCase().includes(q));total.textContent=data.length;active.textContent=data.filter(x=>!x.disabled&&(x.expiresAt===null||new Date(x.expiresAt)>now)).length;expired.textContent=data.filter(x=>x.expiresAt!==null&&new Date(x.expiresAt)<=now).length;disabled.textContent=data.filter(x=>x.disabled).length;rows.innerHTML=f.map(x=>{let exp=x.expiresAt?new Date(x.expiresAt).toLocaleString('vi-VN'):'Vĩnh viễn';let bad=x.disabled||(x.expiresAt&&new Date(x.expiresAt)<=now);return `<tr><td><b>${x.key}</b><br><button onclick="navigator.clipboard.writeText('${x.key}')">Copy</button></td><td>${new Date(x.createdAt).toLocaleString('vi-VN')}</td><td>${exp}</td><td><span class="badge ${bad?'off':''}">${x.disabled?'Đã khóa':(bad?'Hết hạn':'Hoạt động')}</span></td><td><button onclick="act('${x.id}','toggle')">${x.disabled?'Mở':'Khóa'}</button><button onclick="act('${x.id}','delete')">Xóa</button></td></tr>`}).join('')}
</script></main>
