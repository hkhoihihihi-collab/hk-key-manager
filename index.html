<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN HOÀNG KHÔI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050507;color:#eee;font:14px system-ui;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#f21b2b08 1px,transparent 1px),linear-gradient(90deg,#f21b2b08 1px,transparent 1px);background-size:34px 34px;animation:g 12s linear infinite}@keyframes g{to{background-position:34px 34px}}.wrap{max-width:980px;margin:auto;padding:24px 16px 50px}.head{display:flex;align-items:center;gap:14px}.logo{width:62px;height:62px;border:1px solid #f22;border-radius:18px;display:grid;place-items:center;font-weight:1000;font-size:23px;letter-spacing:2px;background:#17070a;box-shadow:0 0 30px #f112;animation:p 2s infinite}@keyframes p{50%{box-shadow:0 0 45px #f126}}h1{margin:0;font-size:25px;letter-spacing:2px}.sub{color:#888;font-size:10px;letter-spacing:2px}.card{background:#0d0d11ee;border:1px solid #361017;border-radius:16px;padding:16px;margin-top:16px;box-shadow:0 16px 50px #0008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:25px;font-weight:900;color:#ff3344}.muted{color:#888;font-size:11px}.form{display:grid;grid-template-columns:1fr 180px 180px auto;gap:8px;margin-top:12px}input,select,button{border-radius:10px;border:1px solid #3e161c;background:#08080b;color:#eee;padding:11px}input{width:100%}button{cursor:pointer;font-weight:800}.primary{background:linear-gradient(90deg,#70000c,#ec1d31)!important;border-color:#f22!important}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #251116}.badge{padding:4px 8px;border-radius:20px;background:#082819;color:#4dff9e}.off{background:#300a0e;color:#ff6875}#login{max-width:420px;margin:70px auto}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}}
</style><body>
<div id="login" class="card"><div style="text-align:center"><div class="logo" style="margin:auto">AHK</div><h1 style="margin-top:15px">ADMIN HOÀNG KHÔI</h1><div class="sub">SECURE CONTROL PANEL</div></div><input id="pw" type="password" placeholder="Mật khẩu Admin" style="margin-top:18px"><button class="primary" style="width:100%;margin-top:10px" onclick="login()">ĐĂNG NHẬP</button><div id="err" class="muted" style="text-align:center;margin-top:9px"></div></div>
<main id="app" class="wrap hide"><div class="head"><div class="logo">AHK</div><div><h1>ADMIN HOÀNG KHÔI</h1><div class="sub">KEY CONTROL • HOLOGRAM / HUD SYSTEM</div></div></div>
<div class="grid"><div class="card"><div class="muted">TỔNG KEY</div><div id="total" class="stat">0</div></div><div class="card"><div class="muted">HOẠT ĐỘNG</div><div id="active" class="stat">0</div></div><div class="card"><div class="muted">HẾT HẠN</div><div id="expired" class="stat">0</div></div><div class="card"><div class="muted">ĐÃ KHÓA</div><div id="disabled" class="stat">0</div></div></div>
<div class="card"><b>TẠO KEY MỚI</b><div class="form"><select id="preset"><option value="1h">1 giờ</option><option value="6h">6 giờ</option><option value="12h">12 giờ</option><option value="1d">1 ngày</option><option value="3d">3 ngày</option><option value="7d">7 ngày</option><option value="14d">14 ngày</option><option value="30d" selected>30 ngày</option><option value="3m">3 tháng</option><option value="6m">6 tháng</option><option value="1y">1 năm</option><option value="forever">Vĩnh viễn</option><option value="custom">Tùy chỉnh</option></select><input id="custom" type="datetime-local"><input id="appId" placeholder="App ID (vd: app1)"><button class="primary" onclick="createKey()">＋ TẠO KEY</button></div></div>
<div class="card"><input id="search" placeholder="🔎 Tìm key / App ID..." oninput="render()"><div class="table" style="margin-top:12px"><table><thead><tr><th>KEY</th><th>APP</th><th>TẠO</th><th>HSD</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script>
let pass="",data=[];const H=()=>({'x-admin-password':pass,'Content-Type':'application/json'});
async function login(){pass=pw.value;let r=await fetch('/api/keys',{headers:H()});if(!r.ok){err.textContent='Mật khẩu không đúng';return}login.classList?.add('hide');document.getElementById('login').classList.add('hide');app.classList.remove('hide');data=await r.json();render()}
async function createKey(){let r=await fetch('/api/keys',{method:'POST',headers:H(),body:JSON.stringify({duration:preset.value,custom:custom.value,appId:appId.value.trim()||'all'})});if(!r.ok){alert('Không tạo được key');return}let k=await r.json();await load();alert('KEY: '+k.key)}
async function load(){let r=await fetch('/api/keys',{headers:H()});if(r.ok){data=await r.json();render()}}
async function act(id,t){await fetch('/api/keys/'+id,{method:t==='delete'?'DELETE':'PATCH',headers:H(),body:t==='toggle'?JSON.stringify({disabled:!data.find(x=>x.id===id).disabled}):undefined});load()}
function render(){let q=search.value.toLowerCase(),now=Date.now(),f=data.filter(x=>(x.key||'').toLowerCase().includes(q)||(x.appId||'').toLowerCase().includes(q));total.textContent=data.length;active.textContent=data.filter(x=>!x.disabled&&(!x.expiresAt||new Date(x.expiresAt)>now)).length;expired.textContent=data.filter(x=>x.expiresAt&&new Date(x.expiresAt)<=now).length;disabled.textContent=data.filter(x=>x.disabled).length;rows.innerHTML=f.map(x=>{let bad=x.disabled||(x.expiresAt&&new Date(x.expiresAt)<=now);return '<tr><td><b>'+x.key+'</b><br><button onclick="navigator.clipboard.writeText(\''+x.key+'\')">COPY</button></td><td>'+(x.appId||'all')+'</td><td>'+new Date(x.createdAt).toLocaleString('vi-VN')+'</td><td>'+(x.expiresAt?new Date(x.expiresAt).toLocaleString('vi-VN'):'Vĩnh viễn')+'</td><td><span class="badge '+(bad?'off':'')+'">'+(x.disabled?'Đã khóa':(bad?'Hết hạn':'Hoạt động'))+'</span></td><td><button onclick="act(\''+x.id+'\',\'toggle\')">'+(x.disabled?'MỞ':'KHÓA')+'</button> <button onclick="act(\''+x.id+'\',\'delete\')">XÓA</button></td></tr>'}).join('')}
</script></body></html>
